# Gradle'in repository baglantilarinda / dependency indirmede
# sonsuza kadar beklemesini engellemek icin network timeout (ms).
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=30000

# Build performansi
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
